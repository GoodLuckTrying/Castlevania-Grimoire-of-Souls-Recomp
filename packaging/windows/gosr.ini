; GoSRecomp settings
[game]
; Game language at the very first start. Empty = your Windows display language.
; After that the game keeps its own setting: change it in the game's options.
; ja-JP en-US en-GB fr-FR fr-CA it-IT de-DE es-MX es-ES ko-KR zh-TW zh-CN pt-BR ru-RU tr-TR ar-SA
language=

[display]
; Frame rate cap: 30, 60, 120, 144, 165, 240... or 0 for no cap. Empty = the game's own (60).
; Above 60 is untested by the game's makers: if anything runs too fast, go back to 60.
fps=
; 1 = wait for the monitor's refresh (no tearing), 0 = don't. Empty: vsync only on 60/120/180/240 Hz
; monitors, where it gives 60 fps; on 75/144/165 Hz ones the game is capped at 60 instead.
; The game was made for 60 fps: above that, attacks can miss and some effects vanish.
vsync=
; fullscreen, borderless or windowed. Empty = as last time.
mode=
; Size for the modes above. Empty = your screen's size (windowed: 3/4 of it).
width=
height=

[controller]
; Controller tables: pc (the game's Windows ones) or mac (what the macOS build used:
; on Windows, PlayStation controllers then scroll menus by themselves).
layout=pc
; The d-pad moves your character too, like the left stick. 0 turns it off.
dpad_move=1
; Xbox controllers are seen as gamepads by Unity's Input System (LT/RT, menus,
; button icons). 0 turns that off if your Xbox controller misbehaves.
xinput=1
; Controllers other than PlayStation and Xbox (Switch Pro, 8BitDo in Switch mode...)
; are read through their standard buttons. 0 = off, 2 = use it for every controller.
standard=1

[effects]
; Experimental: 1 tries to fix effects drawn upside down in some screens.
; It also flips some effects that were right (the tap effect), so it is off.
flip_fix=0

[debug]
; F8 opens the debug menu. menu=0 turns it off; hotkey= takes F1-F12 or a virtual-key code.
menu=1
hotkey=F8

[mouse]
; Mouse buttons can be bound in the game's keyboard options (shown as Mouse L / R / M / 4 / 5). 0 = off.
buttons=1
